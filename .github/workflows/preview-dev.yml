name: Deploy PR to dev

# workflow_run loads this workflow from main, never a PR's modified workflow.
# CI builds without deploy secrets. This job only handles its output as data.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

# Shared dev alias. Denied runs must not cancel an in-flight deployment.
concurrency:
  group: deploy-dev-preview
  cancel-in-progress: false

jobs:
  deploy-dev:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out trusted deployment tooling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Check current preview policy
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/preview-policy.mjs

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: steps.policy.outputs.allowed == 'true'
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        if: steps.policy.outputs.allowed == 'true'
        with:
          just-version: '1.58.0'

      - name: Install trusted-main deployment dependencies
        if: steps.policy.outputs.allowed == 'true'
        run: npm ci --ignore-scripts

      - name: Download this CI attempt's build only
        if: steps.policy.outputs.allowed == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ steps.policy.outputs.artifact_name }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/preview-artifact

      - name: Recheck current policy and PR head before deploying
        if: steps.policy.outputs.allowed == 'true'
        id: recheck
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/preview-policy.mjs

      - name: Deploy prepared artifact to dev
        if: steps.recheck.outputs.allowed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_ARTIFACT: ${{ runner.temp }}/preview-artifact
          PREVIEW_SHA: ${{ steps.recheck.outputs.head_sha }}
        run: just deploy-preview-artifact "$PREVIEW_ARTIFACT" "$PREVIEW_SHA"

      - name: Note dev URL
        if: steps.recheck.outputs.allowed == 'true'
        env:
          PR_NUMBER: ${{ steps.recheck.outputs.pr_number }}
          PREVIEW_SHA: ${{ steps.recheck.outputs.head_sha }}
        run: |
          echo "Deployed PR #${PR_NUMBER} (${PREVIEW_SHA}) to https://dev.revive-web.pages.dev" >> "$GITHUB_STEP_SUMMARY"
